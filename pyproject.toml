[project]
name = "alphaforge"
version = "0.1.0"
description = "Neuro-Symbolic Evolutionary Alpha Discovery Engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "polars>=0.20.0",
    "yfinance>=0.2.36",
    "pydantic>=2.6.0",
    "google-genai>=0.3.0",
    "streamlit>=1.32.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
